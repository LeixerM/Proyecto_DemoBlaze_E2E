name: E2E tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      cucumber_tags:
        description: 'Cucumber tag expression for the UI suite (empty = all scenarios)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API (Karate) + UI (Serenity BDD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Run API tests (Karate)
        run: |
          chmod +x ./gradlew
          ./gradlew :api-tests:test

      - name: Run UI tests and build the Serenity report
        # Run even when the API suite failed, so both reports are always produced.
        if: always()
        env:
          CUCUMBER_TAGS: ${{ inputs.cucumber_tags }}
        run: |
          TAGS_ARG=()
          if [ -n "${CUCUMBER_TAGS}" ]; then TAGS_ARG=("-Dcucumber.filter.tags=${CUCUMBER_TAGS}"); fi
          ./gradlew :ui-tests:test :ui-tests:aggregate "${TAGS_ARG[@]}"

      - name: Assemble the report site
        if: always()
        run: |
          mkdir -p site/karate site/serenity
          cp .github/pages/index.html site/
          if [ -d api-tests/build/karate-reports ]; then cp -r api-tests/build/karate-reports/. site/karate/; fi
          if [ -d ui-tests/target/site/serenity ]; then cp -r ui-tests/target/site/serenity/. site/serenity/; fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: site/
          if-no-files-found: warn

      - name: Upload report site for GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy-report:
    name: Publish reports to GitHub Pages
    needs: test
    # Publish the latest reports from main, including failing runs, so the live site reflects reality.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
