serenity {
  project.name = "Demoblaze - UI suite (Serenity BDD Screenplay)"
  take.screenshots = FOR_EACH_ACTION
}

webdriver {
  driver = chrome
  # Maximum time a WaitUntil waits for the demo site (it loads products and cart rows with AJAX).
  wait.for.timeout = 15000
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      # Headless so the suite runs on CI runners without a display; remove "headless=new" to watch the browser.
      args = ["headless=new", "window-size=1920,1080", "no-sandbox", "disable-dev-shm-usage", "disable-gpu", "remote-allow-origins=*"]
    }
  }
}

# Override with -Denvironment=<name>, or a single value with -Dwebdriver.base.url=... / -Ddemoblaze.api.url=...
environments {
  default {
    webdriver.base.url = "https://www.demoblaze.com"
    home.page = "https://www.demoblaze.com/index.html"
    demoblaze.api.url = "https://api.demoblaze.com"
  }
}
